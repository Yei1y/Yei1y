      <line x1="0" y1="138" x2="0" y2="112" stroke="#8CC2EE" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="140" y1="138" x2="140" y2="106" stroke="#8CC2EE" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M-8 137 L40 137 L58 16 L82 26 L100 48 L118 84 L140 112 L176 132 L214 137"
